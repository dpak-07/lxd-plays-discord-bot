version: '3.8'

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - DATABASE_URL=file:/app/data/bot.sqlite
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
      - MUSIC_ENABLED=${MUSIC_ENABLED:-true}
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bot-data:
    driver: local
